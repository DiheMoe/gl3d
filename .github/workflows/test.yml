name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test -race
        run: go test -race -short ./...

      - name: tools vet and test
        working-directory: tools
        run: |
          go vet ./...
          go test ./...

  pcm-reference:
    # Ubuntu 24.04 的 FFmpeg 6.1 只作兼容性检查,冻结的参考版本见 corpus/manifest.json
    name: PCM reference (Ubuntu 24.04, FFmpeg 6.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install reference decoders
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg mpg123 jq
          version=$(ffmpeg -version | head -n 1)
          echo "$version"
          echo "$version" | grep -qE '^ffmpeg version 6\.1([.-]| )'

      - name: Verify corpus hashes
        run: jq -r '.entries[] | "\(.sha256)  \(.file)"' corpus/manifest.json | sha256sum --strict -c -

      - name: Generate reference PCM
        run: go -C tools run ./refgen "$PWD"/corpus/synthetic/*.mp3 "$PWD"/corpus/synthetic/ref

      - name: Compare every corpus entry with its reference
        run: |
          # 默认 shell 是 bash -e,没有 pipefail。缺了 pipefail,go test 的失败会被 tee 的退出码掩盖
          set -o pipefail
          go test -count=1 -run '^TestEndToEndLavcCorpus$' -v . | tee e2e.log
          want=$(jq '.entries | length' corpus/manifest.json)
          got=$(grep -c -- '--- PASS: TestEndToEndLavcCorpus/' e2e.log || true)
          echo "compared $got of $want corpus entries"
          if grep -q -- '--- SKIP' e2e.log || [ "$got" != "$want" ]; then
            exit 1
          fi

      - name: Generate variants and their reference PCM
        run: |
          go test -count=1 -run '^TestWriteVariants$' . -args -write-variants "$PWD/corpus/variants"
          # 只有两个参考长度一致的第一类变体与参考比较,只为它们生成参考
          mapfile -t inputs < <(jq -r --arg dir "$PWD/corpus/variants" '.variants[] | select(.class == 1 and (.inTestOnly | not) and .expect.ffmpeg == .expect.mpg123) | "\($dir)/\(.name).mp3"' corpus/variants.json)
          go -C tools run ./refgen "${inputs[@]}" "$PWD"/corpus/variants/ref

      - name: Compare class 1 variants with their references
        run: |
          set -o pipefail
          go test -count=1 -run '^TestVariantReferences$' -v . | tee variants.log
          want=$(jq '[.variants[] | select(.class == 1 and (.inTestOnly | not) and .expect.ffmpeg == .expect.mpg123)] | length' corpus/variants.json)
          got=$(grep -c -- '--- PASS: TestVariantReferences/' variants.log || true)
          echo "compared $got of $want class 1 variants"
          if grep -q -- '--- SKIP' variants.log || [ "$got" != "$want" ]; then
            exit 1
          fi

  fuzz-smoke:
    name: fuzz smoke (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test -run='^$' -fuzz=FuzzParseTags -fuzztime=30s .
      - run: go test -run='^$' -fuzz=FuzzFrameData -fuzztime=30s .
      - run: go test -run='^$' -fuzz=FuzzStream -fuzztime=30s .
